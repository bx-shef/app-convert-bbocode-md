# Local / standalone run: open the SPA on http://localhost:${HTTP_PORT:-8080}
# Use docker-compose.prod.yml on a server that already has nginx-proxy + acme-companion.
services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/bx-shef/app-convert-bbocode-md}:${DOCKER_TAG:-latest}
    container_name: app-convert-bbocode-md
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
