server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS terminates at the external nginx-proxy; this server only sees plain http.
  # With the default `absolute_redirect on`, nginx builds trailing-slash redirects
  # (e.g. /widget/im-textarea → /widget/im-textarea/, the `$uri/` branch below)
  # from its own scheme and emits an `http://` Location. Inside a Bitrix24 HTTPS
  # iframe that's a Mixed-Content downgrade and the widget silently fails to load.
  # Relative redirects let the browser keep the original https origin.
  absolute_redirect off;

  # Bitrix24 opens placement iframes with POST (DOMAIN/PROTOCOL/LANG/APP_SID
  # in the body). nginx's static handler rejects POST with 405 — swallow it
  # and re-serve as GET of the same URI.
  error_page 405 =200 $uri;

  # SPA fallback — every unknown route resolves to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-term caching for hashed assets emitted by Nuxt.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # index.html itself must never be cached, otherwise old hashes leak.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
