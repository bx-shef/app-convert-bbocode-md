server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown route resolves to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-term caching for hashed assets emitted by Nuxt.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # index.html itself must never be cached, otherwise old hashes leak.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
