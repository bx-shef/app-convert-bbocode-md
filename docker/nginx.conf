server {
  listen 80;
  server_name _;
  # Don't advertise the nginx version in Server: / error pages.
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # TLS terminates at the external nginx-proxy; this server only sees plain http.
  # With the default `absolute_redirect on`, nginx builds trailing-slash redirects
  # (e.g. /widget/im-textarea → /widget/im-textarea/, the `$uri/` branch below)
  # from its own scheme and emits an `http://` Location. Inside a Bitrix24 HTTPS
  # iframe that's a Mixed-Content downgrade and the widget silently fails to load.
  # Relative redirects let the browser keep the original https origin.
  absolute_redirect off;

  # Bitrix24 opens placement iframes with POST (DOMAIN/PROTOCOL/LANG/APP_SID
  # in the body). nginx's static handler rejects POST with 405 — swallow it
  # and re-serve as GET of the same URI.
  error_page 405 =200 $uri;

  # --- Security headers ---------------------------------------------------------
  # `always` so they also apply to error responses. nginx does NOT inherit
  # add_header into a location that sets its own — so the set is repeated in the
  # two cache locations below. The CSP ships as Report-Only for now: it collects
  # violations in the browser console without enforcing, so a missing directive
  # can't break the app in the portal. Flip the header name to
  # `Content-Security-Policy` (enforce) once a portal QA pass shows a clean console.
  # The CSP is adapted for a Bitrix24 iframe placement:
  #   - NO X-Frame-Options (can't express an allow-list); `frame-ancestors`
  #     scopes embedding to Bitrix24 cloud portals + self. A self-hosted/on-prem
  #     portal on a custom domain must add its origin to frame-ancestors+connect-src.
  #   - script-src keeps 'unsafe-inline' for now: Nuxt emits an inline __NUXT__
  #     payload whose hash changes per build. Strict hash-based script-src is a
  #     follow-up (see currency-converter scripts/csp-hashes.mjs). The Cloudflare
  #     Insights beacon and Yandex.Metrika (mc.yandex.ru — standalone-only, self-
  #     muted in the iframe) are allow-listed.
  #   - style-src 'unsafe-inline': Vue/b24ui inline styles + the [color]/[size]/
  #     [font] preview spans + the print iframe (document.write).
  #   - img-src https:: the Markdown preview may render external images; also
  #     covers the Yandex.Metrika tracking pixels.
  #   - connect-src: b24jssdk REST calls from the install/widget handlers go to the
  #     portal domain; the Cloudflare beacon and Yandex.Metrika post their reports.
  #     NOTE: if you enable feedback (NUXT_PUBLIC_FEEDBACK_URL), add the worker's
  #     origin here BEFORE flipping this CSP to enforce — otherwise the feedback
  #     POST is silently blocked. (The worker also needs CORS/OPTIONS on its side.)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), interest-cohort=()" always;
  # TLS terminates upstream at nginx-proxy; pin HTTPS for 1y including subdomains.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://static.cloudflareinsights.com https://cloudflareinsights.com https://mc.yandex.ru https://*.bitrix24.by https://*.bitrix24.ru https://*.bitrix24.com https://*.bitrix24.eu https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.pl https://*.bitrix24.es https://*.bitrix24.com.br; frame-ancestors 'self' https://*.bitrix24.by https://*.bitrix24.ru https://*.bitrix24.com https://*.bitrix24.eu https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.pl https://*.bitrix24.es https://*.bitrix24.com.br; frame-src 'self'; object-src 'none'; base-uri 'self';" always;

  # SPA fallback — every unknown route resolves to index.html (serves /, /install/,
  # /widget/* — security headers above apply here, this location sets no add_header).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-term caching for hashed assets emitted by Nuxt. Re-assert nosniff (this
  # location overrides add_header inheritance); CSP/frame-ancestors are irrelevant
  # for non-document assets.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html itself must never be cached, otherwise old hashes leak. This
  # location sets its own add_header, so repeat the full security-header set.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://static.cloudflareinsights.com https://cloudflareinsights.com https://mc.yandex.ru https://*.bitrix24.by https://*.bitrix24.ru https://*.bitrix24.com https://*.bitrix24.eu https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.pl https://*.bitrix24.es https://*.bitrix24.com.br; frame-ancestors 'self' https://*.bitrix24.by https://*.bitrix24.ru https://*.bitrix24.com https://*.bitrix24.eu https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.pl https://*.bitrix24.es https://*.bitrix24.com.br; frame-src 'self'; object-src 'none'; base-uri 'self';" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
