# Server profile: behind nginxproxy/nginx-proxy + acme-companion.
# Assumes the proxy stack is already running and exposes the external network `proxy-net`.
# (If not — see Makefile target `init-proxy` or your own b24-ui/docker-compose.server.yml.)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/bx-shef/app-convert-bbocode-md}:${DOCKER_TAG:-latest}
    container_name: app-convert-bbocode-md
    restart: unless-stopped
    expose:
      - "80"
    env_file: .env.prod
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    networks:
      - proxy-net
    labels:
      # Auto-update opt-in: the host's shared Watchtower (ONE per host, with
      # --label-enable) pulls a fresh GHCR image and restarts this container
      # (~5 min) after CI pushes. Replaces the manual `docker compose pull && up -d`
      # and the temporary webhook of PR #8.
      #
      # We intentionally do NOT declare a `watchtower` service here: the sibling
      # stack `currency-converter` already runs one on this host, and a second
      # would collide on `container_name: watchtower` and double-scan the daemon.
      # On a host with no Watchtower yet, bring up a single shared instance — see
      # currency-converter/docker-compose.prod.yml (pinned image + docker.sock).
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy-net:
    external: true
