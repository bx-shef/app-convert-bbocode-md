version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    labels:
      - deps
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      bitrix24:
        patterns:
          - "@bitrix24/*"
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "@nuxtjs/*"
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - deps
      - ci
    commit-message:
      prefix: chore(ci)
