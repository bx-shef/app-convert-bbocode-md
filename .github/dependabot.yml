version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    labels:
      - deps
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      bitrix24:
        patterns:
          - "@bitrix24/*"
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "@nuxtjs/*"
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - deps
      - ci
    commit-message:
      prefix: chore(ci)
    groups:
      # One grouped PR for all action bumps instead of PR-per-action
      # (that's why checkout/pnpm/upload-artifact/deploy-pages arrived as 4
      # separate PRs). Forward-proof: a new action auto-joins this group.
      actions:
        patterns:
          - "*"

  # --- Base Docker images in the Dockerfile (node:*-alpine, nginx:*-alpine) ---
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - deps
      - docker
    commit-message:
      prefix: chore(docker)
    groups:
      docker:
        patterns:
          - "*"
    # node major is ignored ON PURPOSE: Node 25+ dropped corepack from the
    # official images (`RUN corepack enable` → exit 127, see Dockerfile). We stay
    # on the LTS line; the major bump is done by hand with a corepack fix.
    # minor/patch of node:<LTS>-alpine and nginx:*-alpine keep coming automatically.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
