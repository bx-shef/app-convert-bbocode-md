name: Deploy Docker image 🐳
on:
  # Auto: rebuild on every push to main that touches image-affecting files.
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'public/**'
      - 'i18n/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nuxt.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy-docker.yml'
  # Manual: override site_url / base_url / tag for one-off rebuilds.
  workflow_dispatch:
    inputs:
      site_url:
        description: NUXT_PUBLIC_SITE_URL baked into the bundle.
        required: false
      base_url:
        description: NUXT_APP_BASE_URL (default '/').
        required: false
        default: /
      tag:
        description: Image tag (default 'latest').
        required: false
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || 'latest' }}
      NUXT_PUBLIC_SITE_URL: ${{ github.event.inputs.site_url || vars.NUXT_PUBLIC_SITE_URL }}
      NUXT_APP_BASE_URL: ${{ github.event.inputs.base_url || '/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ env.NUXT_PUBLIC_SITE_URL }}
            NUXT_APP_BASE_URL=${{ env.NUXT_APP_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
