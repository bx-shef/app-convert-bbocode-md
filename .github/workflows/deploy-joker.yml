name: Deploy to Joker 🃏
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public URL (NUXT_PUBLIC_SITE_URL). Leave empty to use the secret.
        required: false
      base_url:
        description: Base path (NUXT_APP_BASE_URL). Defaults to '/'.
        required: false
        default: /

# Manual deploys only — uncomment to enable auto-deploy on main:
#  push:
#    branches: [ main ]

concurrency:
  group: deploy-joker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Inputs win over secrets so a one-off staging deploy doesn't need new secrets.
      NUXT_PUBLIC_SITE_URL: ${{ github.event.inputs.site_url || secrets.NUXT_PUBLIC_SITE_URL }}
      NUXT_APP_BASE_URL: ${{ github.event.inputs.base_url || '/' }}
      JOKER_SSH_HOST: ${{ secrets.JOKER_SSH_HOST }}
      JOKER_SSH_USER: ${{ secrets.JOKER_SSH_USER }}
      JOKER_SSH_PORT: ${{ secrets.JOKER_SSH_PORT }}
      JOKER_REMOTE_PATH: ${{ secrets.JOKER_REMOTE_PATH }}
      JOKER_SSH_KEY_PATH: ${{ runner.temp }}/joker_key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Write SSH key
        run: |
          install -m 600 /dev/null "$JOKER_SSH_KEY_PATH"
          printf '%s\n' "${{ secrets.JOKER_SSH_KEY }}" > "$JOKER_SSH_KEY_PATH"

      - name: Build & rsync (joker target)
        run: pnpm deploy joker
