name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# `statuses: write` lets the final job mirror the check_run conclusion to the
# legacy commit-status API, so external tools (and humans) hitting
# `GET /commits/{sha}/status` see "ci: success/failure" instead of an empty
# status list. GitHub Actions itself only writes check_runs.
permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (visual verification)
        run: pnpm test:e2e

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/output
          if-no-files-found: ignore

      # Runs last so `job.status` reflects every prior step (incl. e2e).
      - name: Mirror check_run to commit status (legacy API)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'ci',
              description: `CI ${state} (${context.runId})`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
