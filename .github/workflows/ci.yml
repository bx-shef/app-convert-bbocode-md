name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# `statuses: write` lets the final job mirror the check_run conclusion to the
# legacy commit-status API, so external tools (and humans) hitting
# `GET /commits/{sha}/status` see "ci: success/failure" instead of an empty
# status list. GitHub Actions itself only writes check_runs.
permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    # Bound the run: a hung step (e.g. a dead apt mirror during the Playwright
    # system-deps install) otherwise rides GitHub's 6h default and surfaces as a
    # `cancelled` run that reads like a real failure. 20 min is ~6× a normal
    # green run (~3 min).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Validate the production nginx config in the real nginx image. The Docker
      # image is built only on push→main (deploy-docker.yml), so without this a
      # broken docker/nginx.conf would surface only at deploy. `nginx -t` parses
      # it inside the full http{} context.
      - name: Validate nginx config (docker/nginx.conf)
        run: docker run --rm -v "${{ github.workspace }}/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.31-alpine nginx -t

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright (chromium)
        # --with-deps runs apt-get, which has flaked on a dead Ubuntu mirror and
        # hung the whole job. Bound this step and retry so a transient mirror
        # blip self-heals instead of failing CI (root cause of #91's red).
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying in 15s…"
            sleep 15
          done
          exit 1

      - name: E2E (visual verification)
        run: pnpm test:e2e

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/output
          if-no-files-found: ignore

      # Runs last so `job.status` reflects every prior step (incl. e2e).
      - name: Mirror check_run to commit status (legacy API)
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'ci',
              description: `CI ${state} (${context.runId})`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
