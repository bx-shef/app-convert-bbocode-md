name: Deploy to GitHub Pages 📰
on:
  # Deploy the public standalone/demo ONLY after the `ci` workflow succeeds on
  # main (same quality gate as the canonical Docker contour — never ship red).
  workflow_run:
    workflows: [ "ci" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Gate: build/deploy only when CI succeeded on a real PUSH from THIS repo
    # (not a fork PR — a fork's default branch is also `main`, so the
    # `branches:[main]` name filter alone is not a trust boundary). Manual
    # dispatch bypasses the gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    env:
      # Portable across forks: <owner>.github.io/<repo>/
      NUXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      # Yandex.Metrika counter id (repo variable). Empty = analytics off (fail-safe).
      # deployGhPages() passes process.env through to `nuxt generate`, so this bakes in.
      NUXT_PUBLIC_YANDEX_COUNTER_ID: ${{ vars.NUXT_PUBLIC_YANDEX_COUNTER_ID }}
      # Feedback worker URL (repo variable). Empty = feedback feature hidden (fail-safe).
      NUXT_PUBLIC_FEEDBACK_URL: ${{ vars.NUXT_PUBLIC_FEEDBACK_URL }}
      # B24 Marketplace slug (repo variable). Empty = rating prompt disabled (fail-safe).
      NUXT_PUBLIC_MARKETPLACE_SLUG: ${{ vars.NUXT_PUBLIC_MARKETPLACE_SLUG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch by default — pin to the
          # exact commit that passed CI (falls back to the ref on manual run).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (gh-pages target)
        # `pnpm deploy` is a pnpm built-in for monorepo deploys; use `pnpm run`
        # to invoke our custom script from package.json.
        run: pnpm run deploy gh-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
